name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install

      - name: Criar .env.local
        shell: pwsh
        run: |
          @"
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY=${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          "@ | Out-File -FilePath ".env.local" -Encoding utf8NoBOM

      - name: Configurar certificado de assinatura
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CERT_PWD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:CERT_B64) {
            $bytes = [Convert]::FromBase64String($env:CERT_B64)
            [IO.File]::WriteAllBytes("code-signing.pfx", $bytes)
            "CSC_LINK=code-signing.pfx"           | Out-File -Append -Encoding utf8NoBOM $env:GITHUB_ENV
            "CSC_KEY_PASSWORD=$env:CERT_PWD"      | Out-File -Append -Encoding utf8NoBOM $env:GITHUB_ENV
            Write-Host "Certificado de assinatura configurado."
          } else {
            Write-Host "Secret CODE_SIGNING_CERT_BASE64 nao configurado - build sem assinatura."
          }

      - name: Build
        run: npm run electron:build

      - name: Publicar release
        run: npm run electron:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
