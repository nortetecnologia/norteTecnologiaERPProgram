name: Auto-merge ERP web + Build

on:
  repository_dispatch:
    types: [erp-web-update]
  workflow_dispatch:

jobs:
  merge-and-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout desktop repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add erp-web remote
        run: |
          git remote add erp-web https://github.com/nortetecnologia/norteTecnologiaERP.git || true
          git fetch erp-web main

      - name: Merge erp-web/main (keep ours on conflict)
        run: |
          git merge erp-web/main --no-edit --strategy-option=ours || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump patch version
        run: |
          npm version patch --no-git-tag-version
          $version = node -e "process.stdout.write(require('./package.json').version)"
          echo "NEW_VERSION=$version" >> $env:GITHUB_ENV

      - name: Commit version bump
        run: |
          git add package.json
          git commit -m "chore: bump ${{ env.NEW_VERSION }} [skip ci]"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Compile Electron TypeScript
        run: npm run electron:build:ts

      - name: Build Windows installer
        run: npm run electron:dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NEW_VERSION }}
          name: "Norte ERP v${{ env.NEW_VERSION }}"
          files: |
            release/*.exe
            release/latest.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push version bump to master
        run: git push origin HEAD:master
